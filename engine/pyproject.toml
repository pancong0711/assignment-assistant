[project]
name = "assist-engine"
version = "0.5.0"
description = "assignment-assistant engine: 作业纸设计 + AI 批阅 (CLI / Companion 本地引擎)"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "loguru>=0.7",
    "pillow>=10.0",
    "pypdf>=4.0",
    "httpx>=0.27",
    "jinja2>=3.0",
    # D105：参考答案 md+html 渲染（Markdown → HTML）与白名单净化
    "markdown>=3.5",
    "bleach>=6.0",
    # D171-T6：文档抽取的**纯 Python** 后端（此前只靠 officecli/soffice，
    # 教师机器上通常两者都没有 → 抽取不可用）。体积小、无外部二进制。
    "python-pptx>=0.6",
    "python-docx>=1.0",
]

# D63 T7：学习通只读提取的可选依赖（`uv pip install -e engine[playwright]`；不进主 deps）。
# D168-B3：知识点分析可视化依赖（matplotlib 等体积大，首次安装慢几分钟）——
# 独立成 extra，**不拖累**只用作业纸/批阅的教师。
#   pip install -e engine[viz]     或   pip install -e engine[viz,playwright]
[project.optional-dependencies]
playwright = ["playwright>=1.40"]
viz = [
    "matplotlib>=3.7",
    "networkx>=3.0",
    "numpy>=1.24",
]

# VB-1 HTML 主通道模板（engine/templates/assignment.html.j2）随 wheel 打包：
# 仓库形态从 engine/templates 读，安装形态落到包内 assist/templates。
[tool.hatch.build.targets.wheel.force-include]
"templates" = "assist/templates"

[project.scripts]
assist = "assist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assist"]

[tool.uv]
# D14: 引擎环境收纳进 workspace —— 使用时由 assist bootstrap / 安装脚本
# 将 UV_PROJECT_ENVIRONMENT 与 UV_CACHE_DIR 指向 workspace/.runtime/**

# 阶段3 批阅链路：运行依赖沿用既有声明（httpx/pillow/openpyxl），不新增。
[dependency-groups]
dev = ["pytest>=8.0"]
