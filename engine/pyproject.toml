[project]
name = "assist-engine"
version = "0.1.0"
description = "assignment-assistant engine: 作业纸设计 + AI 批阅 (CLI / Companion 本地引擎)"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "loguru>=0.7",
    "pillow>=10.0",
    "pypdf>=4.0",
    "httpx>=0.27",
    "jinja2>=3.0",
]

# VB-1 HTML 主通道模板（engine/templates/assignment.html.j2）随 wheel 打包：
# 仓库形态从 engine/templates 读，安装形态落到包内 assist/templates。
[tool.hatch.build.targets.wheel.force-include]
"templates" = "assist/templates"

[project.scripts]
assist = "assist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assist"]

[tool.uv]
# D14: 引擎环境收纳进 workspace —— 使用时由 assist bootstrap / 安装脚本
# 将 UV_PROJECT_ENVIRONMENT 与 UV_CACHE_DIR 指向 workspace/.runtime/**

# 阶段3 批阅链路：运行依赖沿用既有声明（httpx/pillow/openpyxl），不新增。
[dependency-groups]
dev = ["pytest>=8.0"]
